name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Reclaim ~30 GB of preinstalled tooling: the Mathlib oleans do not fit on
      # the stock ubuntu-latest disk ("No space left on device").
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false

      # Pin both the installer archive and its checksum rather than executing a
      # mutable installer script or resolving an Elan "latest" release.
      - name: Install Elan v4.2.3
        env:
          ELAN_VERSION: v4.2.3
          ELAN_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/elan.tar.gz"
          curl -fsSL -o "${archive}" \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ELAN_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/elan-init" -y --no-modify-path --default-toolchain none
          rm -f "${RUNNER_TEMP}/elan-init" "${archive}"
          echo "${HOME}/.elan/bin" >> "${GITHUB_PATH}"

      - name: Fetch pinned Mathlib cache
        run: lake exe cache get

      - name: Build the production library
        run: lake build

      - name: Check release metadata
        run: |
          scripts/check-release-metadata.sh
          pipx run --spec check-jsonschema==0.36.2 check-jsonschema \
            --schemafile https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/17b5cdfc99facc7e1dfe0a0daa546a8878fa6217/schema/v0.4.schema.json \
            formalization.yaml
          pipx run --spec cffconvert==2.0.0 cffconvert \
            --validate --infile CITATION.cff

      - name: Check Mathlib-only challenge imports
        run: scripts/check-audit-challenge-imports.sh

      # The Mathlib-only comparator surface. Each Challenge.lean ends in one
      # intentional statement-level `sorry`, which is why `Audit` is not part of
      # `defaultTargets` and is built separately here.
      - name: Build the audit surface
        run: lake build Audit

      # `blueprint/lean_decls` is committed so this checks the complete public
      # dependency graph without requiring the Python leanblueprint toolchain.
      - name: Check blueprint declarations
        run: lake exe checkdecls blueprint/lean_decls

      # Prints `#print axioms` for the six paper-facing results and the focused
      # absorption alias, so the log records that they use only propext,
      # Classical.choice, and Quot.sound.
      - name: Axiom audit
        run: lake build AbsorptionCutoff.Meta.AxiomsAudit
