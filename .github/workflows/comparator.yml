name: Comparator audit

# Independently checks the six paper-facing results and focused absorption alias
# against their Mathlib-only
# restatements in `Audit/`: same elaborated statement, no axiom beyond the three
# standard ones, accepted by the Lean kernel, both sides built in a landrun
# sandbox. This is the evidence a reader can re-run without trusting the
# development.
#
# Split from `build.yml` because it is far slower: every challenge re-elaborates
# `import Mathlib` and every solution imports the whole library.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  comparator:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: project
          persist-credentials: false

      # comparator and lean4export must target the project's Lean version; both
      # commits below are the v4.32.0 window. Same pins as docker/audit.Dockerfile.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: leanprover/comparator
          ref: 07bc4ea40f2266dcb861820a2ec1fa3244ed307f
          path: comparator
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: leanprover/lean4export
          ref: 4e7915201d3f9f04470d9eae002fa695f7cdc589
          path: lean4export
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: Zouuup/landrun
          ref: 62823c05e58ec22c1f91b4c8468318c1f97f2d32 # v0.1.17
          path: landrun
          persist-credentials: false

      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.12'
          cache: false
      - name: Build landrun
        working-directory: landrun
        run: go build -o landrun cmd/landrun/main.go

      - name: Install Elan v4.2.3
        env:
          ELAN_VERSION: v4.2.3
          ELAN_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/elan.tar.gz"
          curl -fsSL -o "${archive}" \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ELAN_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/elan-init" -y --no-modify-path --default-toolchain none
          rm -f "${RUNNER_TEMP}/elan-init" "${archive}"
          echo "${HOME}/.elan/bin" >> "${GITHUB_PATH}"

      # The comparator re-elaborates only Challenge and Solution inside its
      # sandbox, so the library and Mathlib oleans must already be present.
      - name: Fetch pinned Mathlib cache
        working-directory: project
        run: lake exe cache get

      - name: Build the project
        working-directory: project
        run: lake build

      - name: Build lean4export and comparator
        run: |
          (cd lean4export && lake build)
          (cd comparator && lake build)

      - name: Confirm the runner is unprivileged
        run: id

      - name: Check Mathlib-only challenge imports
        working-directory: project
        run: scripts/check-audit-challenge-imports.sh

      # The same script the local Docker run invokes.
      - name: Run every comparator challenge
        working-directory: project
        env:
          # landrun swallows the `--` the comparator passes to lean4export; the
          # shim re-inserts it. Forwarding only -- see the script's header.
          COMPARATOR_LANDRUN: ${{ github.workspace }}/project/docker/landrun-argv-shim.sh
          LANDRUN_REAL: ${{ github.workspace }}/landrun/landrun
          COMPARATOR_LEAN4EXPORT: ${{ github.workspace }}/lean4export/.lake/build/bin/lean4export
          COMPARATOR_BIN: ${{ github.workspace }}/comparator/.lake/build/bin/comparator
        run: ./scripts/run-comparator.sh
