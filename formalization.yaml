classification:
  arxiv: ["math.PR", "math.DS"]
  msc2020: ["60J05", "60K05", "60G50", "37H15", "68T07"]

status:
  scope: >-
    A Lean 4 / Mathlib formalization of absorption cutoff and stationary
    singularities for Gaussian random dynamical systems with coordinatewise tanh
    nonlinearity and nearest-grid rounding: the fixed-width vanishing-mesh cutoff
    profile, with the full cutoff predicate checking center divergence, eventual
    window positivity, and the little-o window condition; the fixed-precision
    dimension cutoff; both clauses of qualitative metastability (including
    fixed-dimensional absorption from every point of the full finite rounded
    state space); the supercritical dimension cutoff in scalar and reconstructed
    vector form; and
    the fixed-dimensional stationary power singularity, with normalized
    directional convergence and the equivalent normalized form of the radial
    asymptotic. Every
    result stated in the manuscript's main-results section is formalized and
    exposed in AbsorptionCutoff/MainTheorems.lean. The six paper-facing results,
    plus a focused alias for the fixed-dimensional absorption clause, are checked
    by leanprover/comparator against restatements written in Mathlib vocabulary
    only. Two supporting libraries were built in-project for lack of Mathlib
    equivalents: positive-drift first-passage asymptotics, and renewal theory up
    to the key renewal theorem.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "AbsorptionCutoff.MainTheorems.rounded_gaussian_nearest_cutoff"
      file: "AbsorptionCutoff/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Audit/FixedWidthCutoff/comparator.json"
      literature_dependencies: []
    - declaration: "AbsorptionCutoff.MainTheorems.subcritical_dimension_cutoff"
      file: "AbsorptionCutoff/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Audit/DimensionCutoff/comparator.json"
      literature_dependencies: []
    - declaration: "AbsorptionCutoff.MainTheorems.rounded_qualitative_metastability"
      file: "AbsorptionCutoff/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Audit/Metastability/comparator.json"
      literature_dependencies: []
    - declaration: "AbsorptionCutoff.MainTheorems.rounded_fixed_dimension_absorption"
      file: "AbsorptionCutoff/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Audit/FixedDimensionAbsorption/comparator.json"
      literature_dependencies: []
    - declaration: "AbsorptionCutoff.MainTheorems.gaussian_process_cutoff"
      file: "AbsorptionCutoff/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Audit/ScalarCutoff/comparator.json"
      literature_dependencies: []
    - declaration: "AbsorptionCutoff.MainTheorems.gaussian_vector_cutoff"
      file: "AbsorptionCutoff/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Audit/VectorCutoff/comparator.json"
      literature_dependencies: []
    - declaration: "AbsorptionCutoff.MainTheorems.nd_power_singularity"
      file: "AbsorptionCutoff/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Audit/PowerSingularity/comparator.json"
      literature_dependencies: []

automation:
  methods:
    - method: "agent"
      models:
        # ChatGPT 5.5 and Claude Opus 4.8 contributed to manuscript drafting and
        # the earlier development. The bulk of the work over the final weeks was
        # done by GPT-5.6; the Claude models contributed throughout, and Opus 5
        # additionally carried the release track (the Mathlib-only audit
        # surface, comparator tooling, CI, and release documentation).
        - "gpt-5.5"
        - "gpt-5.6-sol"
        - "claude-opus-4-8"
        - "claude-opus-5"
      framework: "Codex (OpenAI) and Claude Code (Anthropic) agentic coding harnesses"
      tool_setup: >-
        Lake builds under leanprover/lean4:v4.32.0 with Mathlib v4.32.0. The
        comparator audit was run locally in the pinned container built by
        docker/audit.Dockerfile, with leanprover/comparator at
        07bc4ea40f2266dcb861820a2ec1fa3244ed307f, leanprover/lean4export at
        4e7915201d3f9f04470d9eae002fa695f7cdc589 (both the v4.32.0 window), and
        Zouuup/landrun v0.1.17 at
        62823c05e58ec22c1f91b4c8468318c1f97f2d32. See the disclosure below for
        the one local modification to that tooling.
      cost:
        wall_time: >-
          About two weeks of calendar time: first Lean commit 2026-07-21,
          release candidate finalized 2026-08-13, after roughly 2,870
          development commits. Machine hours were not tracked separately.
        # The standard names this field spend_usd; the amount below is reported
        # in EUR, the currency actually billed.
        spend_usd: >-
          On the order of EUR 120: consumer subscriptions only -- a EUR 100 per
          month ChatGPT Pro plan (the lower-priced Pro tier) and a Claude Pro
          plan, about a single month of each over the two-week project. No
          metered API usage.
        hardware: "the author's laptop (Apple Silicon, Docker Desktop)"
      prompting_notes: >-
        Autoformalization: the Lean proofs were written from the manuscript's
        arguments by the models above under the author's supervision, rather
        than typed by hand. The manuscript acknowledgement names ChatGPT 5.5
        and Claude Opus 4.8, which contributed to its drafting and the earlier
        development; this release metadata additionally records the later
        formalization and release work, with GPT-5.6 responsible for most of the
        recent work and Claude Opus 5 contributing to the release track.
        Correctness does not depend on that process -- it is
        enforced by the Lean kernel, by the machine-verified absence of sorry
        from the production library and of custom axioms, and by the comparator
        checks on the audited declarations. The public repository starts from a
        curated release snapshot; the earlier development commits counted above
        are not included in its public Git history.
  # Reported in EUR, the currency actually billed, despite the field name.
  spend_usd: >-
    On the order of EUR 120: consumer subscriptions only (a EUR 100 per month
    ChatGPT Pro plan, the lower-priced Pro tier, and a Claude Pro plan, about one
    month of each). No metered API usage.
  notes: >-
    Every proof is checked by the Lean kernel and Mathlib; the production library
    contains no sorry and no custom axiom. The Mathlib-only comparator challenge
    files (Audit/*/Challenge.lean) each contain exactly one intentional
    statement-level sorry -- the body of the theorem being challenged -- which
    the corresponding Audit/*/Solution.lean fills and leanprover/comparator
    confirms ("Your solution is okay!"). All seven passed on 2026-08-13 from
    commit b0943d9.

    DISCLOSURE, tooling modification: the comparator is invoked through
    docker/landrun-argv-shim.sh rather than calling landrun directly. landrun
    >= 0.1.16 parses its command line with urfave/cli v3, which consumes the
    first literal "--"; the comparator invokes
    "lean4export <module> -- <decls>", so that separator was being swallowed and
    lean4export read the declaration names as further modules. The shim inserts
    an explicit "--" before the sandboxed command so the remainder is forwarded
    intact. It changes argv forwarding only: every sandbox flag reaches the real
    landrun unmodified, so the Landlock restrictions applied are exactly those
    the comparator requested. (landrun v0.1.15 does not have this bug, but its
    --ldd dependency detection omits the aarch64 dynamic loader and therefore
    cannot exec at all on arm64.) Both are upstream issues.

    DISCLOSURE, sandbox hardening: the comparator's documented invocation wraps
    the run in "systemd-run --property=RestrictAddressFamilies=~AF_UNIX --user",
    guarding against a landrun escape. That wrapper is NOT applied here; the
    local runs instead take place inside a disposable container, which bounds an
    escape to the container rather than the host. This is a weaker guarantee
    than the documented one and is stated as such.

fidelity:
  divergences: >-
    Recorded item by item in CORRESPONDENCE.md, and all of them are packaging,
    proof route, or cases where the Lean result is stronger. After unfolding the
    standing notation and equivalent regime formulations, the manuscript's
    hypotheses imply those of the corresponding Lean declaration, and its
    conclusion implies the manuscript's conclusion. Summary: the fixed-width theorem
    is stated along positive mesh sequences rather than as a continuous limit;
    the renewal terminal term and the signed kernel are handled by different but
    equivalent routes; several manuscript intermediates (the transfer operator,
    the linear Markov-additive equation, the operator packaging of the forcing)
    are not mirrored as standalone declarations because the theorem route
    consumes their content directly; and forcing continuity is proved for every
    bounded measurable angular test rather than only continuous ones.

review:
  status: "author-verified"
  reviewers:
    - "Benny Avelin"
  notes: >-
    The Lean kernel and Mathlib check every production-library proof term (no
    sorry, no custom axiom). The seven audited declarations were additionally
    checked by leanprover/comparator against Mathlib-only restatements. This
    checks the chosen formal statements, not their semantic correspondence with
    the manuscript; that correspondence was reviewed by the author and recorded
    in CORRESPONDENCE.md. This is not external peer review.

