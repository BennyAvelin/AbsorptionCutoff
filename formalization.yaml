status:
  scope: >-
    A Lean 4 / Mathlib formalization of absorption cutoff and stationary
    singularities for Gaussian random dynamical systems with coordinatewise tanh
    nonlinearity and nearest-grid rounding: the fixed-width vanishing-mesh cutoff
    profile, the fixed-precision dimension cutoff, both clauses of qualitative
    metastability, the supercritical dimension cutoff in scalar and reconstructed
    vector form, and the fixed-dimensional stationary power singularity. Every
    result stated in the manuscript's main-results section is formalized and
    exposed in AbsorptionCutoff/MainTheorems.lean; all seven are additionally checked by
    leanprover/comparator against restatements written in Mathlib vocabulary
    only. Two supporting libraries were built in-project for lack of Mathlib
    equivalents: positive-drift first-passage asymptotics, and renewal theory up
    to the key renewal theorem.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "AbsorptionCutoff.MainTheorems.rounded_gaussian_nearest_cutoff"
      file: "AbsorptionCutoff/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Audit/FixedWidthCutoff/comparator.json"
      literature_dependencies: []
    - declaration: "AbsorptionCutoff.MainTheorems.subcritical_dimension_cutoff"
      file: "AbsorptionCutoff/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Audit/DimensionCutoff/comparator.json"
      literature_dependencies: []
    - declaration: "AbsorptionCutoff.MainTheorems.rounded_qualitative_metastability"
      file: "AbsorptionCutoff/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Audit/Metastability/comparator.json"
      literature_dependencies: []
    - declaration: "AbsorptionCutoff.MainTheorems.rounded_fixed_dimension_absorption"
      file: "AbsorptionCutoff/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Audit/FixedDimensionAbsorption/comparator.json"
      literature_dependencies: []
    - declaration: "AbsorptionCutoff.MainTheorems.gaussian_process_cutoff"
