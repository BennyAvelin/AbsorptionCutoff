      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Audit/VectorCutoff/comparator.json"
      literature_dependencies: []
    - declaration: "AbsorptionCutoff.MainTheorems.nd_power_singularity"
